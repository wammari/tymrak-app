<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activate TYMRAK Account</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 30px 20px;
}

.card {
    max-width: 500px;
    margin: 60px auto;
    background: white;
    padding: 36px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
    color: #14213d;
    margin-bottom: 4px;
}

.tagline {
    color: #299764;
    font-weight: bold;
    margin-bottom: 30px;
}

h2 {
    color: #14213d;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    box-sizing: border-box;
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd2d8;
    border-radius: 7px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #14213d;
    color: white;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    display: none;
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
}

.success {
    display: block;
    background: #e8f7ee;
    color: #176b36;
}

.error {
    display: block;
    background: #fdeaea;
    color: #a32020;
}

.password-note {
    font-size: 13px;
    color: #666;
    margin-top: 7px;
}
</style>

</head>

<body>

<div class="card">

<h1>TYMRAK</h1>

<div class="tagline">
TIME. TRACKED RIGHT.
</div>

<h2>Activate Your Account</h2>

<p id="activationDescription">
Create your password to finish setting up your TYMRAK account.
</p>

<form id="activationForm">

<div id="passwordFields">
<label for="password">
New Password
</label>

<input
    id="password"
    type="password"
    minlength="8"
    required
    autocomplete="new-password"
>

<div class="password-note">
Password must contain at least 8 characters.
</div>

<label for="confirmPassword">
Confirm Password
</label>

<input
    id="confirmPassword"
    type="password"
    minlength="8"
    required
    autocomplete="new-password"
>

</div>

<button
    id="activateButton"
    type="submit"
>
Activate My Account
</button>

</form>

<div
    id="message"
    class="message"
></div>

</div>


<script type="module">
import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://tsosredghislnehfyypi.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_u3i0ktj9UjpwUWkEF4sfcg_WZjWo0w6";

// Invitation sessions stay in memory and never consume or overwrite the normal
// login/recovery client's saved session. URL processing is explicit below.
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: {
        storageKey: "tymrak-invitation",
        persistSession: false,
        detectSessionInUrl: false
    }
});
const form = document.getElementById("activationForm");
const button = document.getElementById("activateButton");
const message = document.getElementById("message");
const passwordInput = document.getElementById("password");
const confirmInput = document.getElementById("confirmPassword");
let invitationUserId = null;
let passwordSaved = false;
let busy = false;
button.disabled = true;

function showMessage(type, text) {
    message.className = "message " + type;
    message.style.display = "block";
    message.textContent = text;
}

async function prepareActivation() {
    const query = new URLSearchParams(window.location.search);
    const fragment = new URLSearchParams(window.location.hash.slice(1));
    // Remove credentials even for rejected links, before any network request.
    window.history.replaceState({}, document.title, window.location.pathname);
    try {
        if (query.has("error") || fragment.has("error")) throw new Error("Invalid invitation");
        let result;
        if (fragment.get("type") === "invite" &&
            fragment.get("access_token") && fragment.get("refresh_token")) {
            result = await supabase.auth.setSession({
                access_token: fragment.get("access_token"),
                refresh_token: fragment.get("refresh_token")
            });
        } else if (query.get("type") === "invite" && query.get("token_hash")) {
            result = await supabase.auth.verifyOtp({
                token_hash: query.get("token_hash"), type: "invite"
            });
        } else {
            // A stored login, recovery link, or bare activation URL is not an
            // invitation. Admin invitations do not use PKCE code exchange.
            throw new Error("Invitation credentials required");
        }
        if (result.error || !result.data?.session) throw new Error("Invalid invitation");
        const { data, error } = await supabase.auth.getUser();
        if (error || !data?.user?.id || !data.user.invited_at ||
            data.user.id !== result.data.session.user?.id) {
            throw new Error("Invitation identity could not be verified");
        }
        invitationUserId = data.user.id;
        button.disabled = false;
    } catch {
        form.style.display = "none";
        showMessage("error", "This activation link is invalid or has expired. Please request a new invitation.");
    }
}

async function completeActivation() {
    const { data, error } = await supabase.auth.getSession();
    if (error || !data?.session || data.session.user?.id !== invitationUserId) {
        throw new Error("Your invitation session has expired. Your saved password is unchanged. Please contact your manager.");
    }
    const response = await fetch("/api/complete-activation", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${data.session.access_token}`
        }
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok || result.success !== true) {
        throw new Error(typeof result.error === "string" ? result.error :
            "TYMRAK could not complete activation. Please retry activation completion.");
    }
}

form.addEventListener("submit", async event => {
    event.preventDefault();
    if (busy) return;
    if (!invitationUserId) {
        showMessage("error", "Please reopen a valid invitation link.");
        return;
    }
    if (!passwordSaved) {
        if (passwordInput.value.length < 8) {
            showMessage("error", "Password must contain at least 8 characters.");
            return;
        }
        if (passwordInput.value !== confirmInput.value) {
            showMessage("error", "The passwords do not match.");
            return;
        }
    }
    busy = true;
    button.disabled = true;
    button.textContent = passwordSaved ? "Completing activation..." : "Activating...";
    message.style.display = "none";
    try {
        if (!passwordSaved) {
            const { data, error } = await supabase.auth.getUser();
            if (error || data?.user?.id !== invitationUserId) {
                throw new Error("Your invitation session could not be verified.");
            }
            const result = await supabase.auth.updateUser({ password: passwordInput.value });
            if (result.error) throw result.error;
            // Set this immediately after Auth confirms success, before any
            // completion request. Every subsequent submit skips updateUser.
            passwordSaved = true;
            passwordInput.value = "";
            confirmInput.value = "";
            passwordInput.disabled = true;
            confirmInput.disabled = true;
            document.getElementById("passwordFields").hidden = true;
            document.getElementById("activationDescription").textContent =
                "Your password is saved. Finish activating your employee account.";
            if (result.data?.user?.id !== invitationUserId) {
                throw new Error("Password saved, but the account identity could not be verified. Please contact your manager.");
            }
        }
        await completeActivation();
        form.style.display = "none";
        showMessage("success", "✓ Account activated successfully! Your TYMRAK account is ready.");
    } catch (error) {
        const detail = error?.message || "Unable to activate your account.";
        showMessage("error", passwordSaved ?
            "Your password is saved. " + detail + " You can retry completion on this page without saving it again." : detail);
    } finally {
        busy = false;
        button.disabled = false;
        button.textContent = passwordSaved ? "Retry Activation Completion" : "Activate My Account";
    }
});

prepareActivation();

</script>

</body>
</html>
