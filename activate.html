<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activate TYMRAK Account</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 30px 20px;
}

.card {
    max-width: 500px;
    margin: 60px auto;
    background: white;
    padding: 36px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
    color: #14213d;
    margin-bottom: 4px;
}

.tagline {
    color: #299764;
    font-weight: bold;
    margin-bottom: 30px;
}

h2 {
    color: #14213d;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 7px;
    font-weight: bold;
}

input {
    box-sizing: border-box;
    width: 100%;
    padding: 13px;
    border: 1px solid #ccd2d8;
    border-radius: 7px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 25px;
    background: #14213d;
    color: white;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    display: none;
    margin-top: 20px;
    padding: 14px;
    border-radius: 8px;
}

.success {
    display: block;
    background: #e8f7ee;
    color: #176b36;
}

.error {
    display: block;
    background: #fdeaea;
    color: #a32020;
}

.password-note {
    font-size: 13px;
    color: #666;
    margin-top: 7px;
}
</style>

</head>

<body>

<div class="card">

<h1>TYMRAK</h1>

<div class="tagline">
TIME. TRACKED RIGHT.
</div>

<h2>Activate Your Account</h2>

<p>
Create your password to finish setting up your TYMRAK account.
</p>

<form id="activationForm">

<label for="password">
New Password
</label>

<input
    id="password"
    type="password"
    minlength="8"
    required
    autocomplete="new-password"
>

<div class="password-note">
Password must contain at least 8 characters.
</div>

<label for="confirmPassword">
Confirm Password
</label>

<input
    id="confirmPassword"
    type="password"
    minlength="8"
    required
    autocomplete="new-password"
>

<button
    id="activateButton"
    type="submit"
>
Activate My Account
</button>

</form>

<div
    id="message"
    class="message"
></div>

</div>


<script type="module">

/*
=================================================
TYMRAK SUPABASE CONFIGURATION
=================================================
Replace ONLY the two values below.

NEVER place SUPABASE_SECRET_KEY in this file.
*/

const SUPABASE_URL =
    "https://tsosredghislnehfyypi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_u3i0ktj9UjpwUWkEF4sfcg_WZjWo0w6";


import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
        auth: {
            detectSessionInUrl: true,
            persistSession: trueƒ
        }
    }
);


const form =
    document.getElementById("activationForm");

const button =
    document.getElementById("activateButton");

const message =
    document.getElementById("message");


let activationReady = false;


/*
=================================================
MESSAGE DISPLAY
=================================================
*/

function showMessage(type, text) {

    message.className =
        "message " + type;

    message.style.display =
        "block";

    message.innerHTML =
        text;
}


/*
=================================================
PREPARE INVITATION SESSION
=================================================
*/

async function prepareActivation() {

    try {

        const params =
            new URLSearchParams(
                window.location.search
            );

        const code =
            params.get("code");


        /*
        Supabase invitation links may contain
        a one-time authorization code.

        Exchange that code for an authenticated
        employee session.
        */

        if (code) {

            const { error } =
                await supabase.auth
                    .exchangeCodeForSession(code);

            if (error) {
                throw error;
            }


            /*
            Remove the one-time code from
            the browser address bar.
            */

            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );
        }


        /*
        Confirm that we have an authenticated
        Supabase session.
        */

        const {
            data,
            error
        } =
            await supabase.auth.getSession();


        if (error) {
            throw error;
        }


        if (!data.session) {

            form.style.display =
                "none";

            showMessage(
                "error",
                "This activation link is invalid or has expired. Please request a new invitation."
            );

            return;
        }


        activationReady = true;


    } catch (error) {

        console.error(
            "Activation session error:",
            error
        );


        form.style.display =
            "none";


        showMessage(
            "error",
            "This activation link is invalid or has expired. Please request a new invitation."
        );
    }
}


/*
=================================================
ACTIVATE EMPLOYEE ACCOUNT
=================================================
*/

form.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const password =
            document.getElementById(
                "password"
            ).value;


        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        message.style.display =
            "none";


        /*
        STEP 1
        Confirm invitation session.
        */

        if (!activationReady) {

            showMessage(
                "error",
                "Your activation session is not ready. Please reopen the invitation link."
            );

            return;
        }


        /*
        STEP 2
        Validate password.
        */

        if (password.length < 8) {

            showMessage(
                "error",
                "Password must contain at least 8 characters."
            );

            return;
        }


        if (password !== confirmPassword) {

            showMessage(
                "error",
                "The passwords do not match."
            );

            return;
        }


        button.disabled =
            true;

        button.textContent =
            "Activating...";


        try {

            /*
            STEP 3
            Save password in Supabase Auth.
            */

            const {
                error: passwordError
            } =
                await supabase.auth.updateUser({
                    password: password
                });


            if (passwordError) {
                throw passwordError;
            }


            /*
            STEP 4
            Get authenticated employee session.
            */

            const {
                data: sessionData,
                error: sessionError
            } =
                await supabase.auth.getSession();


            if (
                sessionError ||
                !sessionData.session
            ) {

                throw new Error(
                    "Your password was created, but the activation session could not be verified."
                );
            }


            /*
            STEP 5
            Tell the secure TYMRAK server that
            employee activation is complete.
            */

            const activationResponse =
                await fetch(
                    "/api/complete-activation",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            Authorization:
                                `Bearer ${sessionData.session.access_token}`
                        }
                    }
                );


            let activationResult = {};


            try {

                activationResult =
                    await activationResponse.json();

            } catch {

                activationResult = {};
            }


            if (!activationResponse.ok) {

                throw new Error(
                    activationResult.error ||
                    "Your password was created, but TYMRAK could not complete the employee activation."
                );
            }


            /*
            STEP 6
            Activation completed successfully.
            */

            form.style.display =
                "none";


            showMessage(
                "success",
                "<strong>✓ Account activated successfully!</strong><br><br>" +
                "Your TYMRAK account is ready."
            );


        } catch (error) {

            console.error(
                "Account activation error:",
                error
            );


            showMessage(
                "error",
                error.message ||
                "Unable to activate your account."
            );


            button.disabled =
                false;


            button.textContent =
                "Activate My Account";
        }
    }
);


/*
=================================================
START ACTIVATION PAGE
=================================================
*/

prepareActivation();

</script>

</body>
</html>
