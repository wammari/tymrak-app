<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Login | TYMRAK</title>
<style>
:root { --navy:#1b120e; --green:#b78b46; --muted:#765e4a; --line:#e7d5b8; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; font-family:Inter,Arial,sans-serif; background:#fff8ed; color:#2c1b12; display:grid; place-items:center; padding:24px; }
.card { width:min(440px,100%); padding:38px; background:white; border:1px solid #e7d5b8; border-radius:16px; box-shadow:0 18px 50px rgba(52,34,25,.13); }
.logo { color:var(--navy); font-size:32px; font-weight:900; letter-spacing:.08em; }
.tagline { color:var(--green); font-size:11px; font-weight:800; letter-spacing:.14em; margin-top:3px; }
h1 { color:var(--navy); margin:32px 0 8px; font-size:26px; }
.intro { color:var(--muted); margin:0 0 26px; line-height:1.5; }
label { display:block; font-weight:700; font-size:14px; margin:16px 0 7px; }
input { width:100%; padding:13px; border:1px solid var(--line); border-radius:8px; font:inherit; }
input:focus { outline:3px solid rgba(41,151,100,.13); border-color:var(--green); }
button { width:100%; padding:14px; margin-top:24px; border:0; border-radius:8px; background:var(--navy); color:white; font:inherit; font-weight:800; cursor:pointer; }
button:disabled { opacity:.6; cursor:wait; }
.message { display:none; margin-top:18px; border-radius:8px; padding:13px; font-size:14px; line-height:1.45; }
.message.error { display:block; background:#fff0f0; color:#9b1c1c; }
.back { display:block; margin-top:24px; color:var(--muted); text-align:center; font-size:14px; }

/* TYMRAK approved warm brand styling; login behavior unchanged */
body{background:radial-gradient(circle at 90% 10%,rgba(239,189,100,.24),transparent 36%),linear-gradient(135deg,#fff8ed,#efdfc7)!important;color:#2c1b12}
.card{border:1px solid #e7d5b8!important;box-shadow:0 18px 50px rgba(52,34,25,.13)!important}
button[type=submit],.btn-primary{background:#1b120e!important;color:#fff8ed!important}
button[type=submit]:hover,.btn-primary:hover{background:#8d6332!important}
a{color:#795323}
</style>
</head>
<body>
<main class="card">
  <div class="logo">TYMRAK</div>
  <div class="tagline">TIME. TRACKED RIGHT.</div>
  <h1>Manager Login</h1>
  <p class="intro">Sign in with your TYMRAK account. Manager or administrator access is required.</p>
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="loginButton" type="submit">Sign in to Manager Portal</button>
  </form>
  <div id="message" class="message" role="alert"></div>
  <a class="back" href="/">← Back to portal selection</a>
</main>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

import { getClientSupabaseConfiguration } from "/client-supabase-config.js";
const { url: SUPABASE_URL, publishableKey: SUPABASE_PUBLISHABLE_KEY } = getClientSupabaseConfiguration();
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

async function verifyManager(accessToken) {
  const response = await fetch("/api/manager-session", {
    headers: { Authorization: `Bearer ${accessToken}` }
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Manager access could not be verified");
}

form.addEventListener("submit", async event => {
  event.preventDefault();
  button.disabled = true;
  button.textContent = "Verifying access…";
  message.className = "message";

  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value
    });
    if (error) throw error;
    await verifyManager(data.session.access_token);
    window.location.replace("/manager.html");
  } catch (error) {
    await supabase.auth.signOut();
    message.textContent = error.message === "Manager access required"
      ? "This account does not have Manager Portal access."
      : error.message;
    message.className = "message error";
    button.disabled = false;
    button.textContent = "Sign in to Manager Portal";
  }
});

const { data: { session } } = await supabase.auth.getSession();
if (session) {
  try {
    await verifyManager(session.access_token);
    window.location.replace("/manager.html");
  } catch (_) {
    await supabase.auth.signOut();
  }
}
</script>
</body>
</html>
