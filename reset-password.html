<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TYMRAK - Reset Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #14213d;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 36px;
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .tagline {
            color: #299764;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 28px;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .description {
            margin: 0 0 20px;
            font-size: 14px;
            color: #333333;
            line-height: 1.4;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            margin-bottom: 6px;
            border: 1px solid #d6dce5;
            border-radius: 6px;
            font-size: 14px;
            background: #ffffff;
        }

        input:focus {
            outline: none;
            border-color: #299764;
        }

        .hint {
            font-size: 12px;
            color: #666666;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #14213d;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.4;
        }

        .success {
            display: block;
            background: #e4f5eb;
            color: #176b3a;
        }

        .error {
            display: block;
            background: #fde8e8;
            color: #a61b1b;
        }

        .login-link {
            display: inline-block;
            margin-top: 14px;
            color: #14213d;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="brand">
            TYMRAK
        </div>

        <div class="tagline">
            TIME. TRACKED RIGHT.
        </div>

        <div id="form">

            <h2>
                Reset Your Password
            </h2>

            <p class="description">
                Create a new password for your TYMRAK account.
            </p>

            <label for="password">
                New Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="new-password"
            >

            <div class="hint">
                Password must contain at least 8 characters.
            </div>

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
            >

            <button
                id="resetButton"
                type="button"
            >
                Update Password
            </button>

        </div>

        <div
            id="message"
            class="message"
        ></div>

    </div>


    <script type="module">

       import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

import { getClientSupabaseConfiguration } from "/client-supabase-config.js";
const { url: supabaseUrl, publishableKey: supabaseKey } = getClientSupabaseConfiguration();


// Capture the recovery URL before Supabase consumes and clears its hash.
const recoveryHash = new URLSearchParams(window.location.hash.slice(1));
const recoveryQuery = new URLSearchParams(window.location.search);
const recoveryAccessToken = recoveryHash.get("type") === "recovery"
    ? recoveryHash.get("access_token")
    : null;
const recoveryCodeFlow = recoveryQuery.get("type") === "recovery"
    && recoveryQuery.has("code");

const supabase = createClient(supabaseUrl, supabaseKey, {
    auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
    }
});

const form = document.getElementById("form");
const message = document.getElementById("message");
const button = document.getElementById("resetButton");

let recoveryReady = false;
let recoveryUserId = null;
let recoveryEventSeen = false;

function showMessage(type, text) {
    message.className = "message " + type;
    message.innerHTML = type === "success" ? text : "";
    if (type !== "success") message.textContent = text;
}

function markRecoverySession(session) {
    if (!session?.user?.id || !session.access_token) return;
    recoveryReady = true;
    recoveryUserId = session.user.id;
    button.disabled = false;
    message.className = "message";
    message.textContent = "";
}

// A normal signed-in session is NOT sufficient to authorize a password reset.
button.disabled = true;
supabase.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
        recoveryEventSeen = true;
        markRecoverySession(session);
    } else if (event === "SIGNED_OUT") {
        recoveryReady = false;
        recoveryUserId = null;
        button.disabled = true;
    }
});

// Some browser/CDN timings cause the recovery event to fire before the
// listener attaches. Only recover that case if the session's access token
// matches the token delivered in the recovery URL (not an older login).
async function checkRecoverySession() {
    if (recoveryReady || !recoveryAccessToken) return;
    const { data, error } = await supabase.auth.getSession();
    if (!error && data?.session?.access_token === recoveryAccessToken) {
        const { data: userData, error: userError } = await supabase.auth.getUser();
        if (!userError && userData?.user?.id === data.session.user?.id) {
            markRecoverySession(data.session);
        }
    }
}

checkRecoverySession().catch(() => {});
// PKCE recovery links must produce PASSWORD_RECOVERY; never treat a
// pre-existing session as proof of recovery merely because a code exists.


async function resetPassword() {

    const password =
        document
            .getElementById("password")
            .value;

    const confirmPassword =
        document
            .getElementById("confirmPassword")
            .value;


    await checkRecoverySession();

    if (!recoveryReady) {

        showMessage(
            "error",
            "Your password reset session is not ready. Please reopen the newest password reset link."
        );

        return;
    }


    if (password.length < 8) {

        showMessage(
            "error",
            "Password must be at least 8 characters."
        );

        return;
    }


    if (password !== confirmPassword) {

        showMessage(
            "error",
            "Passwords do not match."
        );

        return;
    }


    try {

        button.disabled = true;
        button.textContent =
            "Updating Password...";


        const {
            data,
            error
        } =
            await supabase.auth
                .updateUser({
                    password: password
                });


        if (error) {
            throw error;
        }


        if (!data?.user?.id) {

            throw new Error(
                "Supabase did not confirm the password update."
            );
        }


        if (
            recoveryUserId &&
            data.user.id !== recoveryUserId
        ) {

            throw new Error(
                "Password recovery user mismatch."
            );
        }


        console.log(
            "Password updated for user:",
            data.user.id
        );


        form.style.display =
            "none";


        showMessage(
            "success",
            "✓ Password updated successfully!<br><br>Your new TYMRAK password is ready.<br><br><a href='/login.html'>Go to Employee Login</a>"
        );


    } catch (error) {

        console.error(
            "Password update error:",
            error
        );


        showMessage(
            "error",
            error.message ||
            "Unable to update your password."
        );


        button.disabled = false;
        button.textContent =
            "Update Password";
    }
}


button.addEventListener(
    "click",
    resetPassword
);
    </script>

</body>
</html>
