<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TYMRAK - Reset Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #14213d;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            padding: 36px;
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        .brand {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .tagline {
            color: #299764;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 28px;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 21px;
        }

        .description {
            margin: 0 0 20px;
            font-size: 14px;
            color: #333333;
            line-height: 1.4;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            margin-bottom: 6px;
            border: 1px solid #d6dce5;
            border-radius: 6px;
            font-size: 14px;
            background: #ffffff;
        }

        input:focus {
            outline: none;
            border-color: #299764;
        }

        .hint {
            font-size: 12px;
            color: #666666;
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #14213d;
            color: #ffffff;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 14px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.4;
        }

        .success {
            display: block;
            background: #e4f5eb;
            color: #176b3a;
        }

        .error {
            display: block;
            background: #fde8e8;
            color: #a61b1b;
        }

        .login-link {
            display: inline-block;
            margin-top: 14px;
            color: #14213d;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="brand">
            TYMRAK
        </div>

        <div class="tagline">
            TIME. TRACKED RIGHT.
        </div>

        <div id="form">

            <h2>
                Reset Your Password
            </h2>

            <p class="description">
                Create a new password for your TYMRAK account.
            </p>

            <label for="password">
                New Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="new-password"
            >

            <div class="hint">
                Password must contain at least 8 characters.
            </div>

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                id="confirmPassword"
                type="password"
                autocomplete="new-password"
            >

            <button
                id="resetButton"
                type="button"
            >
                Update Password
            </button>

        </div>

        <div
            id="message"
            class="message"
        ></div>

    </div>


    <script type="module">

        import {
            createClient
        } from
        "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


        const supabaseUrl =
            "https://tsosredghislnehfyypi.supabase.co";

        const supabaseKey =
            "PASTE_THE_SAME_PUBLISHABLE_KEY_USED_IN_ACTIVATE_HTML";


        const supabase =
            createClient(
                supabaseUrl,
                supabaseKey
            );


        const form =
            document.getElementById("form");

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("resetButton");

        let recoveryReady =
            false;


        function showMessage(
            type,
            text
        ) {

            message.className =
                "message " + type;

            message.innerHTML =
                text;
        }


        async function initializeRecovery() {

            try {

                const params =
                    new URLSearchParams(
                        window.location.search
                    );

                const code =
                    params.get("code");


                if (code) {

                    const {
                        error
                    } =
                        await supabase.auth
                            .exchangeCodeForSession(
                                code
                            );


                    if (error) {
                        throw error;
                    }


                    window.history.replaceState(
                        {},
                        document.title,
                        window.location.pathname
                    );
                }


                const {
                    data,
                    error
                } =
                    await supabase.auth
                        .getSession();


                if (error) {
                    throw error;
                }


                if (!data.session) {

                    form.style.display =
                        "none";

                    showMessage(
                        "error",
                        "This password reset link is invalid or has expired. Please request a new password reset."
                    );

                    return;
                }


                recoveryReady =
                    true;


            } catch (error) {

                console.error(
                    "Password recovery session error:",
                    error
                );


                form.style.display =
                    "none";


                showMessage(
                    "error",
                    "This password reset link is invalid or has expired. Please request a new password reset."
                );
            }
        }


        async function resetPassword() {

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            if (!recoveryReady) {

                showMessage(
                    "error",
                    "Your password reset session is not ready. Please reopen the password reset link."
                );

                return;
            }


            if (password.length < 8) {

                showMessage(
                    "error",
                    "Password must contain at least 8 characters."
                );

                return;
            }


            if (
                password !==
                confirmPassword
            ) {

                showMessage(
                    "error",
                    "The passwords do not match."
                );

                return;
            }


            button.disabled =
                true;

            button.textContent =
                "Updating...";


            try {

                const {
                    error
                } =
                    await supabase.auth
                        .updateUser({
                            password:
                                password
                        });


                if (error) {
                    throw error;
                }


                form.style.display =
                    "none";


                showMessage(
                    "success",
                    "<strong>✓ Password updated successfully!</strong><br><br>" +
                    "Your new TYMRAK password is ready.<br>" +
                    "<a class='login-link' href='/login.html'>Go to Employee Login</a>"
                );


            } catch (error) {

                console.error(
                    "Password reset error:",
                    error
                );


                showMessage(
                    "error",
                    error.message ||
                    "TYMRAK could not update your password."
                );


                button.disabled =
                    false;

                button.textContent =
                    "Update Password";
            }
        }


        button.addEventListener(
            "click",
            resetPassword
        );


        initializeRecovery();

    </script>

</body>
</html>
