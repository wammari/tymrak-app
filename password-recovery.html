<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TYMRAK - Password Recovery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
            color: #14213d;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .slogan {
            color: #159957;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 28px;
        }

        h2 {
            margin: 0 0 10px;
            font-size: 18px;
        }

        p {
            margin: 0 0 22px;
            font-size: 13px;
            line-height: 1.6;
            color: #4b5563;
        }

        .button {
            display: block;
            width: 100%;
            padding: 13px 16px;
            background: #14213d;
            color: #ffffff;
            text-decoration: none;
            text-align: center;
            border-radius: 5px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .button:hover {
            opacity: 0.92;
        }

        .note {
            margin-top: 18px;
            margin-bottom: 0;
            font-size: 11px;
            color: #6b7280;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo">TYMRAK</div>

        <div class="slogan">
            TIME. TRACKED RIGHT.
        </div>

        <h2>Password Reset</h2>

        <p>
            A password reset was requested for your TYMRAK account.
            Click the button below to continue securely to the password
            reset page.
        </p>

        <a
            id="continueButton"
            class="button"
            href="#"
        >
            Continue to Reset Password
        </a>

        <p class="note">
            If you did not request a password reset,
            you can safely close this page.
        </p>

    </div>


    <script>
        const params =
            new URLSearchParams(
                window.location.search
            );

        const recoveryUrl =
            params.get("recovery_url");

        const button =
            document.getElementById(
                "continueButton"
            );


        if (recoveryUrl) {

            button.addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    window.location.href =
                        recoveryUrl;
                }
            );

        } else {

            button.textContent =
                "Invalid Password Reset Link";

            button.style.opacity =
                "0.6";

            button.style.pointerEvents =
                "none";
        }
    </script>

</body>
</html>
