<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TYMRAK Employee Portal</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    color: #14213d;
}

.header {
    background: white;
    padding: 18px 30px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.tagline {
    color: #299764;
    font-size: 13px;
    font-weight: bold;
}

.logout {
    background: white;
    border: 1px solid #14213d;
    color: #14213d;
    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: 35px auto;
    padding: 0 20px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
    margin-bottom: 24px;
}

.welcome {
    margin: 0 0 6px;
}

.employee-info {
    color: #667085;
    margin-bottom: 25px;
}

.clock-area {
    text-align: center;
    padding: 20px 0;
}

.live-time {
    font-size: 54px;
    font-weight: bold;
    letter-spacing: 1px;
}

.live-date {
    margin-top: 8px;
    color: #667085;
    font-size: 17px;
}

.status-label {
    margin-top: 25px;
    color: #667085;
    font-size: 14px;
}

.status {
    display: inline-block;
    margin-top: 8px;
    padding: 9px 16px;
    border-radius: 22px;
    font-weight: bold;
}

.status-off {
    background: #eef1f4;
    color: #475467;
}

.status-working {
    background: #e8f7ee;
    color: #176b36;
}

.status-break {
    background: #fff3d6;
    color: #8a5a00;
}

.button-area {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 28px;
}

.punch-button {
    min-width: 200px;
    padding: 17px 24px;
    border: 0;
    border-radius: 9px;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.clock-in {
    background: #299764;
}

.clock-out {
    background: #14213d;
}

.break-start {
    background: #b7791f;
}

.break-end {
    background: #299764;
}

.punch-button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.message {
    display: none;
    margin: 20px auto 0;
    max-width: 500px;
    padding: 13px;
    border-radius: 8px;
    text-align: center;
}

.success {
    display: block;
    background: #e8f7ee;
    color: #176b36;
}

.error {
    display: block;
    background: #fdeaea;
    color: #a32020;
}

h2 {
    margin-top: 0;
}

.punch-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.punch-row:last-child {
    border-bottom: 0;
}

.punch-type {
    font-weight: bold;
}

.punch-time {
    color: #475467;
}

.empty,
.loading {
    color: #667085;
}

@media (max-width: 600px) {

    .header {
        padding: 16px 20px;
    }

    .live-time {
        font-size: 43px;
    }

    .card {
        padding: 24px 20px;
    }

    .punch-button {
        width: 100%;
    }
}

</style>

</head>

<body>

<header class="header">

<div>
    <div class="logo">TYMRAK</div>
    <div class="tagline">TIME. TRACKED RIGHT.</div>
</div>

<button id="logoutButton" class="logout">
    Sign Out
</button>

</header>

<main class="container">

<section class="card">

<h1 id="welcome" class="welcome">
    Loading...
</h1>

<div id="employeeInfo" class="employee-info"></div>

<div class="clock-area">

    <div id="liveTime" class="live-time">
        --:--:--
    </div>

    <div id="liveDate" class="live-date"></div>

    <div class="status-label">
        CURRENT STATUS
    </div>

    <div id="workStatus" class="status status-off">
        Loading...
    </div>

    <div id="buttonArea" class="button-area"></div>

    <div id="message" class="message"></div>

</div>

</section>

<section class="card">

<h2>Today's Punches</h2>

<div id="punchList">
    <p class="loading">Loading punches...</p>
</div>

</section>

</main>

<script type="module">

const SUPABASE_URL =
    "https://tsosredghislnehfyypi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_u3i0ktj9UjpwUWkEF4sfcg_WZjWo0w6";

import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const welcome =
    document.getElementById("welcome");

const employeeInfo =
    document.getElementById("employeeInfo");

const liveTime =
    document.getElementById("liveTime");

const liveDate =
    document.getElementById("liveDate");

const workStatus =
    document.getElementById("workStatus");

const buttonArea =
    document.getElementById("buttonArea");

const punchList =
    document.getElementById("punchList");

const message =
    document.getElementById("message");

const logoutButton =
    document.getElementById("logoutButton");

let employee = null;

let currentStatus =
    "not_clocked_in";


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function showMessage(type, text) {

    message.className =
        "message " + type;

    message.textContent =
        text;
}


function clearMessage() {

    message.style.display =
        "none";
}


function updateClock() {

    const now = new Date();

    liveTime.textContent =
        now.toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

    liveDate.textContent =
        now.toLocaleDateString(
            [],
            {
                weekday: "long",
                year: "numeric",
                month: "long",
                day: "numeric"
            }
        );
}


function createButton(
    text,
    className,
    punchType
) {

    const button =
        document.createElement("button");

    button.className =
        "punch-button " + className;

    button.textContent =
        text;

    button.addEventListener(
        "click",
        () => recordPunch(
            punchType,
            button
        )
    );

    return button;
}


function updateStatusDisplay() {

    buttonArea.innerHTML = "";


    if (
        currentStatus === "working"
    ) {

        workStatus.textContent =
            "Working";

        workStatus.className =
            "status status-working";


        buttonArea.appendChild(
            createButton(
                "Start Break",
                "break-start",
                "break_start"
            )
        );


        buttonArea.appendChild(
            createButton(
                "Clock Out",
                "clock-out",
                "clock_out"
            )
        );

        return;
    }


    if (
        currentStatus === "on_break"
    ) {

        workStatus.textContent =
            "On Break";

        workStatus.className =
            "status status-break";


        buttonArea.appendChild(
            createButton(
                "End Break",
                "break-end",
                "break_end"
            )
        );

        return;
    }


    workStatus.textContent =
        "Not Clocked In";

    workStatus.className =
        "status status-off";


    buttonArea.appendChild(
        createButton(
            "Clock In",
            "clock-in",
            "clock_in"
        )
    );
}


function getTodayStartISO() {

    const start =
        new Date();

    start.setHours(
        0,
        0,
        0,
        0
    );

    return start.toISOString();
}


function formatPunchType(type) {

    const labels = {

        clock_in:
            "Clock In",

        clock_out:
            "Clock Out",

        break_start:
            "Break Start",

        break_end:
            "Break End"
    };

    return labels[type] || type;
}


function formatPunchTime(timestamp) {

    return new Date(
        timestamp
    ).toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }
    );
}


function determineStatus(lastPunch) {

    if (!lastPunch) {

        return "not_clocked_in";
    }


    switch (
        lastPunch.punch_type
    ) {

        case "clock_in":
        case "break_end":

            return "working";


        case "break_start":

            return "on_break";


        case "clock_out":

            return "not_clocked_in";


        default:

            return "not_clocked_in";
    }
}


async function loadTodaysPunches() {

    const {
        data,
        error
    } =
        await supabase
            .from("punches")
            .select(
                "id,punch_type,punched_at"
            )
            .eq(
                "employee_id",
                employee.id
            )
            .gte(
                "punched_at",
                getTodayStartISO()
            )
            .order(
                "punched_at",
                {
                    ascending: true
                }
            );


    if (error) {
        throw error;
    }


    if (
        !data ||
        data.length === 0
    ) {

        currentStatus =
            "not_clocked_in";

        punchList.innerHTML =
            `<p class="empty">
                No punches recorded today.
            </p>`;

        updateStatusDisplay();

        return;
    }


    const lastPunch =
        data[data.length - 1];


    currentStatus =
        determineStatus(
            lastPunch
        );


    punchList.innerHTML =
        data.map(
            punch => `
                <div class="punch-row">

                    <div class="punch-type">
                        ${escapeHTML(
                            formatPunchType(
                                punch.punch_type
                            )
                        )}
                    </div>

                    <div class="punch-time">
                        ${escapeHTML(
                            formatPunchTime(
                                punch.punched_at
                            )
                        )}
                    </div>

                </div>
            `
        ).join("");


    updateStatusDisplay();
}


async function loadEmployee() {

    try {

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabase.auth
                .getSession();


        if (
            sessionError ||
            !sessionData.session
        ) {

            window.location.href =
                "/login.html";

            return;
        }


        const user =
            sessionData.session.user;


        const {
            data: employeeData,
            error: employeeError
        } =
            await supabase
                .from("employees")
                .select(
                    "id,first_name,last_name,email,username,position,department,employment_status,invitation_status,is_active"
                )
                .eq(
                    "auth_user_id",
                    user.id
                )
                .single();


        if (employeeError) {
            throw employeeError;
        }


        if (
            !employeeData.is_active ||
            employeeData.invitation_status !==
                "Account Activated"
        ) {

            throw new Error(
                "This employee account is not active."
            );
        }


        employee =
            employeeData;


        const fullName =
            `${employee.first_name} ${employee.last_name || ""}`
                .trim();


        welcome.textContent =
            `Welcome, ${fullName}`;


        const details = [];


        if (employee.position) {

            details.push(
                employee.position
            );
        }


        if (employee.department) {

            details.push(
                employee.department
            );
        }


        employeeInfo.textContent =
            details.length
                ? details.join(" • ")
                : employee.username;


        await loadTodaysPunches();


    } catch (error) {

        console.error(
            "Employee portal error:",
            error
        );


        welcome.textContent =
            "Unable to load TYMRAK";


        employeeInfo.textContent =
            "";


        buttonArea.innerHTML =
            "";


        punchList.innerHTML =
            `<div class="error">
                Unable to load your employee account.
            </div>`;
    }
}


async function recordPunch(
    punchType,
    button
) {

    if (!employee) {
        return;
    }


    clearMessage();


    const allButtons =
        buttonArea.querySelectorAll(
            "button"
        );


    allButtons.forEach(
        item => {
            item.disabled = true;
        }
    );


    const originalText =
        button.textContent;


    button.textContent =
        "Recording...";


    try {

        const {
            error
        } =
            await supabase
                .from("punches")
                .insert({

                    employee_id:
                        employee.id,

                    punch_type:
                        punchType,

                    source:
                        "employee"
                });


        if (error) {
            throw error;
        }


        const successMessages = {

            clock_in:
                "✓ Clocked in successfully.",

            break_start:
                "✓ Break started.",

            break_end:
                "✓ Break ended.",

            clock_out:
                "✓ Clocked out successfully."
        };


        showMessage(
            "success",
            successMessages[punchType]
        );


        await loadTodaysPunches();


    } catch (error) {

        console.error(
            "Punch error:",
            error
        );


        showMessage(
            "error",
            error.message ||
            "Unable to record your punch."
        );


        button.textContent =
            originalText;


        updateStatusDisplay();
    }
}


logoutButton.addEventListener(
    "click",
    async () => {

        await supabase.auth
            .signOut();

        window.location.href =
            "/login.html";
    }
);


updateClock();

setInterval(
    updateClock,
    1000
);


loadEmployee();

</script>

</body>
</html>
