name: TYMRAK tests

on:
  pull_request:
    branches: [main, fix/basic-clock-release, feature/manual-geofencing, feature/company-isolation, feature/cloudflare-free-hosting, ops/production-backup]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node.js test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full test suite
        run: npm test
      - name: Build Cloudflare candidate without deploying
        run: npm run check:cloudflare
      - name: Check Cloudflare local runtime with fake credentials
        run: npm run test:cloudflare
      - name: Check production bundle without deploying
        run: npm run check:cloudflare:production
      - name: Check production local runtime with fake credentials
        run: npm run test:cloudflare:production
