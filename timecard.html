<script type="module">
import { loadSupabaseConfiguration } from "./supabase-config.js";
import { mountAccountDeletion } from "./account-deletion-ui.js";
import { businessSwitcher, chosenBusiness, loadMyBusinesses, showBusinessPicker } from "./employee-business.js";
import {
    applyOvertime,
    buildDailyRecords,
    dateKey,
    selectOvertimeRuleForPeriod
} from "./timecard-calculation.js";
import {
    DEFAULT_PAY_SCHEDULE,
    nextPayPeriod,
    normalizePayTimeline,
    payPeriodFor,
    previousPayPeriod
} from "./pay-periods.js";
const deploymentConfiguration = await loadSupabaseConfiguration();
const SUPABASE_URL = deploymentConfiguration.supabaseUrl;
const SUPABASE_PUBLISHABLE_KEY = deploymentConfiguration.supabasePublishableKey;






    let currentOvertimeRule = null;
let employeeTimeZone = "America/Toronto";
import { createClient } from
"/supabase-js.bundle.js";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const employeeInfo =
    document.getElementById("employeeInfo");

const periodValue =
    document.getElementById("periodValue");

const periodLabel =
    document.getElementById("periodLabel");

const previousPeriodButton =
    document.getElementById("previousPeriodButton");

const nextPeriodButton =
    document.getElementById("nextPeriodButton");


const timecardBody =
    document.getElementById("timecardBody");

const clockButton =
    document.getElementById("clockButton");

const logoutButton =
    document.getElementById("logoutButton");


let employee = null;
let currentPayPeriod = null;
let paySchedule = DEFAULT_PAY_SCHEDULE;
let selectedPayPeriod = null;


/*
    Pay periods follow the company's own schedule (weekly, every
    two weeks, semi-monthly or monthly), worked out by the shared
    /pay-periods.js used by the manager timecards too. Each period
    keeps its calendar dates (startKey, endKey) and exact start and
    end times in the employee's time zone (start, end).
*/

function toEmployeePeriod(period) {

    const [startYear, startMonth, startDay] =
        period.startKey.split("-").map(Number);

    const [endYear, endMonth, endDay] =
        period.endKey.split("-").map(Number);

    return {
        ...period,
        start:
            createDateInEmployeeTimeZone(
                startYear,
                startMonth - 1,
                startDay,
                0, 0, 0, 0
            ),
        end:
            createDateInEmployeeTimeZone(
                endYear,
                endMonth - 1,
                endDay,
                23, 59, 59, 999
            )
    };
}

function getCurrentPayPeriod(date = new Date()) {

    return toEmployeePeriod(
        payPeriodFor(
            dateKey(date, employeeTimeZone),
            paySchedule
        )
    );
}

function getPreviousPayPeriod(period) {

    return toEmployeePeriod(
        previousPayPeriod(period, paySchedule)
    );
}

function getNextPayPeriod(period) {

    return toEmployeePeriod(
        nextPayPeriod(period, paySchedule)
    );
}

function canNavigateToPayPeriod(
    period,
    maximumPeriod = currentPayPeriod
) {
    return Boolean(
        maximumPeriod &&
        period.startKey <= maximumPeriod.startKey
    );
}

function getPayPeriodDateKeys(period) {

    return {
        startKey: period.startKey,
        endKey: period.endKey
    };
}

function formatDate(date) {

    return date.toLocaleDateString(
        [],
        {
            month: "short",
            day: "numeric",
            year: "numeric",
            timeZone: employeeTimeZone
        }
    );
}
function formatTime(timestamp) {

    if (!timestamp) {
        return "—";
    }

    return new Date(
        timestamp
    ).toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit",
            timeZone: employeeTimeZone
        }
    );
}

function getDatePartsInEmployeeTimeZone(date = new Date()) {

    const formatter =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: employeeTimeZone,
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        );

    const parts =
        formatter.formatToParts(date);

    return {
        year: Number(
            parts.find(
                part => part.type === "year"
            ).value
        ),
        month: Number(
            parts.find(
                part => part.type === "month"
            ).value
        ),
        day: Number(
            parts.find(
                part => part.type === "day"
            ).value
        )
    };
}
function createDateInEmployeeTimeZone(
    year,
    month,
    day,
    hour = 0,
    minute = 0,
    second = 0,
    millisecond = 0
) {

    const utcGuess =
        new Date(
            Date.UTC(
                year,
                month,
                day,
                hour,
                minute,
                second,
                millisecond
            )
        );

    const formatter =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: employeeTimeZone,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hourCycle: "h23"
            }
        );

    const parts =
        Object.fromEntries(
            formatter
                .formatToParts(utcGuess)
                .filter(
                    part =>
                        part.type !== "literal"
                )
                .map(
                    part => [
                        part.type,
                        part.value
                    ]
                )
        );

    const asUTC =
        Date.UTC(
            Number(parts.year),
            Number(parts.month) - 1,
            Number(parts.day),
            Number(parts.hour),
            Number(parts.minute),
            Number(parts.second),
            millisecond
        );

    const offset =
        asUTC - utcGuess.getTime();

    return new Date(
        utcGuess.getTime() - offset
    );
}
function formatDuration(milliseconds) {

    const totalMinutes =
        Math.floor(
            Math.max(
                0,
                milliseconds
            ) / 60000
        );

    const hours =
        Math.floor(
            totalMinutes / 60
        );

    const minutes =
        totalMinutes % 60;

    return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0")
    );
}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function renderTimecard(
    punches,
    period
) {

    if (
        !punches ||
        punches.length === 0
    ) {
        timecardBody.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="empty">
                    No time recorded for this pay period.
                </td>
            </tr>
        `;
        return;
    }

    /*
        Regular, overtime and double time come from the shared
        calculation in /timecard-calculation.js, the same code the
        manager timecards use. Days before the visible pay period are
        included so weekly overtime is correct when a pay period starts
        mid-week, then filtered out below.
    */
    const days =
        applyOvertime(
            buildDailyRecords(
                punches,
                employeeTimeZone,
                { now: new Date() }
            ),
            currentOvertimeRule
        );

    const startKey =
        dateKey(period.start, employeeTimeZone);

    const endKey =
        dateKey(period.end, employeeTimeZone);

    const rows =
        days
            .filter(day =>
                day.date >= startKey &&
                day.date <= endKey
            )
            .map(day => {

                const overtime =
                    formatDuration(
                        day.overtimeMilliseconds
                    ) +
                    (
                        day.doubleTimeMilliseconds > 0
                            ? " + " +
                              formatDuration(
                                  day.doubleTimeMilliseconds
                              ) +
                              " double time"
                            : ""
                    );

                const punchLabels = {
                    clock_in: "Clock In",
                    clock_out: "Clock Out",
                    break_start: "Break Start",
                    break_end: "Break End"
                };

                const punchDetails =
                    day.punches
                        .map(punch => `
                            <div class="punch-detail-item">
                                <span class="punch-type">
                                    ${escapeHTML(
                                        punchLabels[punch.punch_type] ||
                                        punch.punch_type
                                    )}
                                </span>
                                <span>
                                    ${escapeHTML(
                                        formatTime(
                                            punch.punched_at
                                        )
                                    )}
                                </span>
                            </div>
                        `)
                        .join("");

                return `
                    <tr
                        class="timecard-row"
                        data-date="${escapeHTML(day.date)}">
                        <td>
                            <span class="pending">
                                Pending
                            </span>
                        </td>
                        <td>
                            ${escapeHTML(
                                formatDate(
                                    new Date(
                                        day.date +
                                        "T12:00:00"
                                    )
                                )
                            )}
                        </td>
                        <td>
                            ${escapeHTML(
                                formatTime(
                                    day.clockIn
                                )
                            )}
                        </td>
                        <td>
                            ${escapeHTML(
                                formatTime(
                                    day.clockOut
                                )
                            )}
                        </td>
                        <td>
                            —
                        </td>
                        <td>
                            ${escapeHTML(
                                formatDuration(
                                    day.workedMilliseconds
                                )
                            )}
                        </td>
                        <td>
                            ${escapeHTML(
                                formatDuration(
                                    day.regularMilliseconds
                                )
                            )}
                        </td>
                        <td>
                            ${escapeHTML(overtime)}
                        </td>
                    </tr>
                    <tr
                        class="punch-detail-row"
                        data-detail-date="${escapeHTML(day.date)}">
                        <td
                            colspan="8"
                            class="punch-detail-cell">
                            <div class="punch-details">
                                <div class="punch-details-title">
                                    Punch Details
                                </div>
                                ${punchDetails}
                            </div>
                        </td>
                    </tr>
                `;
            })
            .join("");

    timecardBody.innerHTML =
        rows;


    /*
        Open or close the punch details
        when the employee clicks a day.
    */

    const timecardRows =
        timecardBody.querySelectorAll(
            ".timecard-row"
        );


    timecardRows.forEach(row => {

        row.addEventListener(
            "click",
            () => {

                const dateKey =
                    row.dataset.date;

                const detailRow =
                    timecardBody.querySelector(
                        `[data-detail-date="${dateKey}"]`
                    );

                if (detailRow) {
                    detailRow.classList.toggle(
                        "open"
                    );
                }
            }
        );
    });
}

function updatePeriodNavigation() {

    const isCurrentPeriod =
        selectedPayPeriod.key ===
        currentPayPeriod.key;

    periodLabel.textContent =
        isCurrentPeriod
            ? "CURRENT PAY PERIOD"
            : "PAY PERIOD";

    previousPeriodButton.disabled = false;
    nextPeriodButton.disabled =
        !canNavigateToPayPeriod(
            getNextPayPeriod(
                selectedPayPeriod
            )
    );
}

async function loadOvertimeRuleForPeriod(period) {

    const {
        startKey,
        endKey
    } =
        getPayPeriodDateKeys(period);

    const {
        data: overtimeRules,
        error: overtimeRuleError
    } =
        await supabase
            .from("overtime_rules")
            .select(`
                id,
                province_code,
                province_name,
                rule_name,
                weekly_threshold_hours,
                daily_threshold_hours,
                alternate_daily_threshold_hours,
                overtime_multiplier,
                double_time_threshold_hours,
                double_time_multiplier,
                holiday_week_threshold_hours,
                daily_overtime_enabled,
                weekly_overtime_enabled,
                requires_schedule_rule,
                calculation_method,
                holiday_rule,
                holiday_reduction_hours,
                supports_averaging,
                week_start_day,
                effective_from,
                effective_to
            `)
            .eq(
                "province_code",
                employee.province
            )
            .eq(
                "is_active",
                true
            )
            .eq(
                "is_default",
                true
            )
            .eq(
                "is_special_rule",
                false
            )
            .lte(
                "effective_from",
                endKey
            )
            .or(
                `effective_to.is.null,effective_to.gte.${startKey}`
            )
            .order(
                "effective_from",
                {
                    ascending: false
                }
            );

    if (overtimeRuleError) {
        throw overtimeRuleError;
    }

    currentOvertimeRule =
        selectOvertimeRuleForPeriod(
            overtimeRules || [],
            startKey,
            endKey
        );
}

async function loadPayPeriod(period) {

    selectedPayPeriod = period;

    periodValue.textContent =
        formatDate(period.start) +
        " – " +
        formatDate(period.end);

    updatePeriodNavigation();

    previousPeriodButton.disabled = true;
    nextPeriodButton.disabled = true;

    timecardBody.innerHTML = `
        <tr>
            <td colspan="8" class="loading">
                Loading timecard...
            </td>
        </tr>
    `;

    await loadOvertimeRuleForPeriod(period);

    /*
        Extend the punch retrieval range
        back to the beginning of the workweek.

        This allows weekly overtime to be
        calculated correctly when a pay
        period begins in the middle of a week.
    */

    const periodStartParts =
        getDatePartsInEmployeeTimeZone(
            period.start
        );

    const periodStartNoon =
        new Date(
            Date.UTC(
                periodStartParts.year,
                periodStartParts.month - 1,
                periodStartParts.day,
                12, 0, 0, 0
            )
        );

    const weekStartDay =
        Number(
            currentOvertimeRule?.week_start_day ?? 0
        );

    const daysSinceWeekStart =
        (
            periodStartNoon.getUTCDay() -
            weekStartDay +
            7
        ) % 7;

    periodStartNoon.setUTCDate(
        periodStartNoon.getUTCDate() -
        daysSinceWeekStart
    );

    const calculationStart =
        createDateInEmployeeTimeZone(
            periodStartNoon.getUTCFullYear(),
            periodStartNoon.getUTCMonth(),
            periodStartNoon.getUTCDate(),
            0, 0, 0, 0
        );

    const {
        data: punches,
        error: punchesError
    } =
        await supabase
            .from("punches")
            .select(
                "id,punch_type,punched_at,location_name"
            )
            .eq(
                "employee_id",
                employee.id
            )
            .gte(
                "punched_at",
                calculationStart.toISOString()
            )
            .lte(
                "punched_at",
                period.end.toISOString()
            )
            .order(
                "punched_at",
                {
                    ascending: true
                }
            );

    if (punchesError) {
        throw punchesError;
    }

    renderTimecard(
        punches || [],
        period
    );

    updatePeriodNavigation();
}

function getTimecardErrorMessage(
    error,
    fallbackMessage
) {

    return error?.code ===
        "OVERTIME_RULE_BOUNDARY"
            ? error.message
            : fallbackMessage;
}

        const {
            data: sessionData,

        } =
            await supabase.auth
                .getSession();


        if (
            sessionError ||

        ) {

            window.location.href =

            return;
        }


        const user =
            sessionData.session.user;

        // People who work for several businesses see one business at a time.
        const businesses = await loadMyBusinesses(supabase);
        const business = chosenBusiness(businesses, user.id);
        if (businesses && businesses.length > 1 && !business) {
            employeeInfo.textContent = "Choose your business";

        }

            supabase

)
                .eq(
                    "auth_user_id",
                    user.id
                );
        if (business) employeeQuery = employeeQuery.eq("id", business.employee_id);
        const {
            data: employeeData,
            error: employeeError
        } = await employeeQuery.single();


        if (employeeError) {
            throw employeeError;
        }
const provinceTimeZones = {
    AB: "America/Edmonton",
    BC: "America/Vancouver",
    SK: "America/Regina",
    MB: "America/Winnipeg",
    ON: "America/Toronto",
    QC: "America/Toronto",
    NB: "America/Moncton",
    NS: "America/Halifax",
    PE: "America/Halifax",
    NL: "America/St_Johns",
    NT: "America/Yellowknife",
    NU: "America/Iqaluit",
    YT: "America/Whitehorse"
};

mountAccountDeletion({ supabase, employeeId: employeeData.id });
employeeTimeZone =
    provinceTimeZones[employeeData.province] ||
    "America/Toronto";

        if (
            (!employeeData.is_active && !employeeData.termination_date) ||
            employeeData.invitation_status !==
                "Account Activated"
        ) {

            throw new Error(
                "Employee account is not active."
            );
        }
if (!employeeData.province) {
    throw new Error(
        "Employee province/jurisdiction is not assigned."
    );
}


        employee =
            employeeData;


        const fullName =
            `${employee.first_name} ${employee.last_name || ""}`
                .trim();


        const details = [];

        details.push(fullName);

        if (employee.position) {
            details.push(
                employee.position
            );
        }

        if (employee.department) {
            details.push(
                employee.department
            );
        }


        if (businesses && businesses.length > 1 && business) details.unshift(business.company_name);
        employeeInfo.textContent =
            details.join(" • ");
        const switcher = businessSwitcher(businesses, business, user.id);
        if (switcher) employeeInfo.after(switcher);


        /*
            The company's pay schedule history: the schedule chosen
            at sign-up, then any changes, each from its start date.
            The lookup returns only this employee's own company.
        */
        const {
            data: scheduleRows,
            error: scheduleError
        } =
            await supabase.rpc(
                "employee_pay_schedule",
                { p_employee_id: employee.id }
            );

        if (scheduleError) {
            throw scheduleError;
        }

        paySchedule =
            normalizePayTimeline(
                Array.isArray(scheduleRows)
                    ? scheduleRows
                    : [scheduleRows]
            );

        currentPayPeriod =
            getCurrentPayPeriod();

        await loadPayPeriod(
            currentPayPeriod
        );


    } catch (error) {

        console.error(
            "Timecard error:",
            error
        );

        employeeInfo.textContent =
            "Unable to load timecard.";

        periodValue.textContent =
            "—";

        const errorMessage =
            getTimecardErrorMessage(
                error,
                "Unable to load your timecard."
            );

        timecardBody.innerHTML = `
            <tr>
                <td colspan="8">
                    <div class="error">
                        ${escapeHTML(errorMessage)}
                    </div>
                </td>
            </tr>
        `;
    }
}

async function navigateToPayPeriod(period) {

    try {
        await loadPayPeriod(period);
    } catch (error) {
        console.error(
            "Pay period navigation error:",
            error
        );

        updatePeriodNavigation();

        const errorMessage =
            getTimecardErrorMessage(
                error,
                "Unable to load this pay period."
            );

        timecardBody.innerHTML = `
            <tr>
                <td colspan="8">
                    <div class="error">
                        ${escapeHTML(errorMessage)}
                    </div>
                </td>
            </tr>
        `;
    }
}

previousPeriodButton.addEventListener(
    "click",
    () => {
        navigateToPayPeriod(
            getPreviousPayPeriod(
                selectedPayPeriod
            )
        );
    }
);

nextPeriodButton.addEventListener(
    "click",
    () => {
        const nextPeriod =
            getNextPayPeriod(
                selectedPayPeriod
            );

        if (!canNavigateToPayPeriod(nextPeriod)) {
            return;
        }

        navigateToPayPeriod(
            nextPeriod
        );
    }
);


clockButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "/employee.html";
    }
);


logoutButton.addEventListener(
    "click",
    async () => {

        await supabase.auth
            .signOut();

        window.location.href =
            "/login.html";
    }
);


loadTimecard();

</script>
