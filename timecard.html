/*

    Semi-monthly

    1st - 15th
    16th - last day
*/

function getCurrentPayPeriod(date = new Date()) {

    const now =
        getDatePartsInEmployeeTimeZone(date);

    return getPayPeriod(
        now.year,
        now.month - 1,
        now.day <= 15 ? 1 : 2
    );
}

function getPayPeriod(
    year,
    month,
    half
) {

    const normalizedMonth =
        new Date(
            Date.UTC(year, month, 1)
        );

    year =
        normalizedMonth.getUTCFullYear();

    month =
        normalizedMonth.getUTCMonth();

    let start;
    let end;

    if (half === 1) {

   start =
    createDateInEmployeeTimeZone(
        year,
        month,
        1,
        0, 0, 0, 0
    );

end =
    createDateInEmployeeTimeZone(
        year,
        month,
        15,
        23, 59, 59, 999
    );

    } else {

    start =
    createDateInEmployeeTimeZone(
        year,
        month,
        16,
        0, 0, 0, 0
    );

end =
    createDateInEmployeeTimeZone(
        year,
        month + 1,
        0,
        23, 59, 59, 999
    );
    }

    return {
        start,
        end,
        year,
        month,
        half,
        key:
            `${year}-${String(
                month + 1
            ).padStart(2, "0")}-${half}`
    };
}

function getPreviousPayPeriod(period) {

    return period.half === 2
        ? getPayPeriod(
            period.year,
            period.month,
            1
        )
        : getPayPeriod(
            period.year,
            period.month - 1,
            2
        );
}

function getNextPayPeriod(period) {

    return period.half === 1
        ? getPayPeriod(
            period.year,
            period.month,
            2
        )
        : getPayPeriod(
            period.year,
            period.month + 1,
            1
        );
}

function canNavigateToPayPeriod(
    period,
    maximumPeriod = currentPayPeriod
) {

    return (
        maximumPeriod &&
        period.key <= maximumPeriod.key
    );
}

function getPayPeriodDateKeys(period) {

    const start =
        getDatePartsInEmployeeTimeZone(
            period.start
        );

    const end =
        getDatePartsInEmployeeTimeZone(

        );

function selectOvertimeRuleForPeriod(
    overtimeRules,
    startKey,
    endKey
) {

    const matchingRules =
        overtimeRules.filter(rule =>
            rule.effective_from <= endKey &&
            (
                !rule.effective_to ||
                rule.effective_to >= startKey
            )
        );

    const coveringRules =
        matchingRules.filter(rule =>
            rule.effective_from <= startKey &&
            (
                !rule.effective_to ||
                rule.effective_to >= endKey
            )
        );

    if (matchingRules.length === 0) {
        throw new Error(
            "No overtime rule applies to this pay period."
        );
    }

    if (
        matchingRules.length !== 1 ||
        coveringRules.length !== 1
    ) {
        const error = new Error(
            "This pay period crosses an overtime-rule effective-date boundary and cannot be calculated as a single timecard."
        );

        error.code =
            "OVERTIME_RULE_BOUNDARY";

        throw error;
    }

    return coveringRules[0];
}
function formatDate(date) {

    return date.toLocaleDateString(
        [],
        {
            month: "short",

function formatTime(timestamp) {

    if (!timestamp) {

    return new Date(

}

function getDatePartsInEmployeeTimeZone(date = new Date()) {

    const formatter =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: employeeTimeZone,
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        );

    const parts =
        formatter.formatToParts(date);

    return {
        year: Number(
            parts.find(
                part => part.type === "year"
            ).value
        ),
        month: Number(
            parts.find(
                part => part.type === "month"
            ).value
        ),
        day: Number(
            parts.find(
                part => part.type === "day"
            ).value
        )
    };
}
function createDateInEmployeeTimeZone(
    year,
    month,
    day,
    hour = 0,
    minute = 0,
    second = 0,
    millisecond = 0
) {

    const utcGuess =
        new Date(
            Date.UTC(
                year,
                month,
                day,
                hour,
                minute,
                second,
                millisecond
            )
        );

    const formatter =
        new Intl.DateTimeFormat(
            "en-US",
            {
                timeZone: employeeTimeZone,
                year: "numeric",
                month: "2-digit",
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hourCycle: "h23"
            }
        );

    const parts =
        Object.fromEntries(
            formatter
                .formatToParts(utcGuess)
                .filter(
                    part =>
                        part.type !== "literal"
                )
                .map(
                    part => [
                        part.type,
                        part.value
                    ]
                )
        );

    const asUTC =
        Date.UTC(
            Number(parts.year),
            Number(parts.month) - 1,
            Number(parts.day),
            Number(parts.hour),
            Number(parts.minute),
            Number(parts.second),
            millisecond
        );

    const offset =
        asUTC - utcGuess.getTime();

    return new Date(
        utcGuess.getTime() - offset
    );
}
function formatDuration(milliseconds) {

    const totalMinutes =
        Math.floor(
            Math.max(
                0,
                milliseconds
            ) / 60000
        );

    const hours =
        Math.floor(
            totalMinutes / 60
        );

    const minutes =
        totalMinutes % 60;

    return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0")
    );
}


function escapeHTML(value) {

}

function groupPunchesByDate(punches) {

    const groups = {};

    const dateFormatter =
        new Intl.DateTimeFormat(
            "en-CA",

function calculateWeeklyOvertime(
    dailyRecords,
    overtimeRule
) {

    if (
        !overtimeRule ||
        !overtimeRule.weekly_overtime_enabled ||
        !overtimeRule.weekly_threshold_hours
    ) {
        return dailyRecords;
    }


    const weeklyThresholdMilliseconds =
        Number(
            overtimeRule.weekly_threshold_hours
        ) *
        60 *
        60 *
        1000;


    const weekStartDay =
        Number(
            overtimeRule.week_start_day ?? 0
        );


    let currentWeekKey = null;
    let accumulatedWeeklyMilliseconds = 0;


    return dailyRecords.map(record => {

        const date =
            new Date(
                record.dateKey +
                "T12:00:00"
            );


        /*
            Determine the beginning
            of this employee's workweek.

            0 = Sunday
            1 = Monday
            ...
            6 = Saturday
        */

        const daysSinceWeekStart =
            (
                date.getDay() -
                weekStartDay +
                7
            ) % 7;


        const weekStart =
            new Date(date);


        weekStart.setDate(
            date.getDate() -
            daysSinceWeekStart
        );


        const weekKey =
            weekStart.getFullYear() +
            "-" +
            String(
                weekStart.getMonth() + 1
            ).padStart(2, "0") +
            "-" +
            String(
                weekStart.getDate()
            ).padStart(2, "0");


        if (weekKey !== currentWeekKey) {

            currentWeekKey =
                weekKey;

            accumulatedWeeklyMilliseconds =
                0;
        }


        const workedMilliseconds =
            record.workedMilliseconds;


        const remainingRegularMilliseconds =
            Math.max(
                0,
                weeklyThresholdMilliseconds -
                accumulatedWeeklyMilliseconds
            );


        const regularMilliseconds =
            Math.min(
                workedMilliseconds,
                remainingRegularMilliseconds
            );


        const overtimeMilliseconds =
            Math.max(
                0,
                workedMilliseconds -
                regularMilliseconds
            );


        accumulatedWeeklyMilliseconds +=
            workedMilliseconds;


        return {
            ...record,
            regularMilliseconds,
            overtimeMilliseconds,
            weekKey
        };
    });
}
function calculateGreaterDailyOrWeeklyOvertime(
    dailyRecords,
    overtimeRule
) {

    if (
        !overtimeRule ||
        !overtimeRule.daily_threshold_hours ||
        !overtimeRule.weekly_threshold_hours
    ) {
        return dailyRecords;
    }


    const dailyThresholdMilliseconds =
        Number(
            overtimeRule.daily_threshold_hours
        ) *
        60 *
        60 *
        1000;


    const weeklyThresholdMilliseconds =
        Number(
            overtimeRule.weekly_threshold_hours
        ) *
        60 *
        60 *
        1000;


    const weekStartDay =
        Number(
            overtimeRule.week_start_day ?? 0
        );


    /*
        Group the daily records
        into workweeks.
    */

    const weeks = {};


    for (const record of dailyRecords) {

        const date =
            new Date(
                record.dateKey +
                "T12:00:00"
            );


        const daysSinceWeekStart =
            (
                date.getDay() -
                weekStartDay +
                7
            ) % 7;


        const weekStart =
            new Date(date);


        weekStart.setDate(
            date.getDate() -
            daysSinceWeekStart
        );


        const weekKey =
            weekStart.getFullYear() +
            "-" +
            String(
                weekStart.getMonth() + 1
            ).padStart(2, "0") +
            "-" +
            String(
                weekStart.getDate()
            ).padStart(2, "0");


        if (!weeks[weekKey]) {
            weeks[weekKey] = [];
        }


        weeks[weekKey].push({
            ...record,
            weekKey
        });
    }


    const calculatedRecords = [];


    for (
        const [weekKey, weekRecords]
        of Object.entries(weeks)
    ) {

        weekRecords.sort(
            (a, b) =>
                a.dateKey.localeCompare(
                    b.dateKey
                )
        );


        /*
            Calculate total daily overtime
            for this workweek.
        */

        const totalDailyOvertime =
            weekRecords.reduce(
                (total, record) => {

                    return total +
                        Math.max(
                            0,
                            record.workedMilliseconds -
                            dailyThresholdMilliseconds
                        );
                },
                0
            );


        /*
            Calculate total weekly overtime
            for this workweek.
        */

        const totalWeeklyWorked =
            weekRecords.reduce(
                (total, record) =>
                    total +
                    record.workedMilliseconds,
                0
            );


        const totalWeeklyOvertime =
            Math.max(
                0,
                totalWeeklyWorked -
                weeklyThresholdMilliseconds
            );


        /*
            Alberta-style rule:
            use whichever overtime total
            is greater for the workweek.
        */

        const useDailyMethod =
            totalDailyOvertime >
            totalWeeklyOvertime;


        if (useDailyMethod) {

            for (const record of weekRecords) {

                const overtimeMilliseconds =
                    Math.max(
                        0,
                        record.workedMilliseconds -
                        dailyThresholdMilliseconds
                    );


                const regularMilliseconds =
                    record.workedMilliseconds -
                    overtimeMilliseconds;


                calculatedRecords.push({
                    ...record,
                    regularMilliseconds,
                    overtimeMilliseconds,
                    weekKey
                });
            }

        } else {

            /*
                Weekly calculation won.

                Allocate regular hours first,
                then overtime after the weekly
                threshold is reached.
            */

            let accumulatedWeeklyMilliseconds =
                0;


            for (const record of weekRecords) {

                const remainingRegularMilliseconds =
                    Math.max(
                        0,
                        weeklyThresholdMilliseconds -
                        accumulatedWeeklyMilliseconds
                    );


                const regularMilliseconds =
                    Math.min(
                        record.workedMilliseconds,
                        remainingRegularMilliseconds
                    );


                const overtimeMilliseconds =
                    Math.max(
                        0,
                        record.workedMilliseconds -
                        regularMilliseconds
                    );


                accumulatedWeeklyMilliseconds +=
                    record.workedMilliseconds;


                calculatedRecords.push({
                    ...record,
                    regularMilliseconds,
                    overtimeMilliseconds,
                    weekKey
                });
            }
        }
    }


    return calculatedRecords.sort(
        (a, b) =>
            a.dateKey.localeCompare(
                b.dateKey
            )
    );
}
function calculateDay(punches) {

    let firstClockIn = null;
    let lastClockOut = null;

    let workStartedAt = null;
    let breakStartedAt = null;

    let workedMilliseconds = 0;
    let breakMilliseconds = 0;

        [...punches].sort(
            (a, b) =>
                new Date(a.punched_at) -

    for (const punch of sortedPunches) {

            new Date(
                punch.punched_at

            punch.punch_type === "break_start"

            if (breakStartedAt === null) {

        } else if (
            punch.punch_type === "break_end"

            if (breakStartedAt !== null) {

                breakMilliseconds +=
                    Math.max(

                        time - breakStartedAt
                    );

                breakStartedAt = null;
            }

            if (workStartedAt === null) {
                workStartedAt = time;
            }


        } else if (
            punch.punch_type === "clock_out"
        ) {

            if (workStartedAt !== null) {

                workedMilliseconds +=
                    Math.max(
                        0,
                        time - workStartedAt
                    );

                workStartedAt = null;
            }

            /*
                If someone clocks out while
                on break, close the break too.
            */

            if (breakStartedAt !== null) {

                breakMilliseconds +=
                    Math.max(
                        0,
                        time - breakStartedAt
                    );

                breakStartedAt = null;
            }

            lastClockOut =
                punch.punched_at;
        }
    }


    /*
        For today's open shift, continue
        counting until the current time.

        Historical incomplete shifts will
        later be flagged as Missing Punch.

   const todayParts =

const punchParts =

const isToday =
    punchParts &&
    punchParts.year === todayParts.year &&
    punchParts.month === todayParts.month &&
    punchParts.day === todayParts.day;

    if (
        isToday &&
        workStartedAt !== null
    ) {

        workedMilliseconds +=
            Math.max(
                0,
                Date.now() -
                workStartedAt
            );
    }


    if (
        isToday &&
        breakStartedAt !== null
    ) {

        breakMilliseconds +=
            Math.max(
                0,
                Date.now() -
                breakStartedAt
            );
    }


    return {
        firstClockIn,
        lastClockOut,
        workedMilliseconds,
        breakMilliseconds
    };
}

function renderTimecard(
    punches,
    period
) {

    if (
        !punches ||
        punches.length === 0
    ) {

        timecardBody.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="empty">
                    No time recorded for this pay period.
                </td>
            </tr>
        `;

        return;
    }


    const groups =
        groupPunchesByDate(
            punches
        );
/*
    Build daily records for the full
    calculation range.

    Some days may be before the visible
    pay period but are required for
    weekly overtime calculations.
*/

const dailyRecords =
    Object.keys(groups)
        .sort()
        .map(dateKey => {

            const result =
                calculateDay(
                    groups[dateKey]
                );

            return {
                dateKey,
                workedMilliseconds:
                    result.workedMilliseconds
            };
        });


let overtimeRecords;


if (
    currentOvertimeRule?.calculation_method ===
    "greater_daily_or_weekly"
) {

    overtimeRecords =
        calculateGreaterDailyOrWeeklyOvertime(
            dailyRecords,
            currentOvertimeRule
        );

} else {

    /*
        Default calculation:
        weekly overtime only.
    */

    overtimeRecords =
        calculateWeeklyOvertime(
            dailyRecords,
            currentOvertimeRule
        );
}


const overtimeByDate =
    Object.fromEntries(
        overtimeRecords.map(
            record => [
                record.dateKey,
                record
            ]
        )
    );

const rows =
    Object.keys(groups)
        .sort()
       .filter(dateKey => {

    const startParts =
        getDatePartsInEmployeeTimeZone(
            period.start
        );

    const endParts =
        getDatePartsInEmployeeTimeZone(
            period.end
        );

    const startKey =
        `${startParts.year}-${String(
            startParts.month
        ).padStart(2, "0")}-${String(
            startParts.day
        ).padStart(2, "0")}`;

    const endKey =
        `${endParts.year}-${String(
            endParts.month
        ).padStart(2, "0")}-${String(
            endParts.day
        ).padStart(2, "0")}`;

    return (
        dateKey >= startKey &&
        dateKey <= endKey
    );
})        .map(dateKey => {

                const dayPunches =
                    groups[dateKey];

                const result =
                    calculateDay(
                        dayPunches
                    );
const overtimeRecord =
    overtimeByDate[dateKey];


const regular =
    formatDuration(
        overtimeRecord
            ? overtimeRecord.regularMilliseconds
            : result.workedMilliseconds
    );


const overtime =
    formatDuration(
        overtimeRecord
            ? overtimeRecord.overtimeMilliseconds
            : 0
    );
                const displayDate =
                    new Date(
                        dateKey +
                        "T12:00:00"
                    );

                const total =
                    formatDuration(
                        result.workedMilliseconds
                    );


                /*
                    Build the individual
                    punch details for this day.
                */

                const punchDetails =
                    [...dayPunches]
                        .sort(
                            (a, b) =>
                                new Date(a.punched_at) -
                                new Date(b.punched_at)
                        )
                        .map(punch => {

                            let punchLabel =
                                punch.punch_type;

                            if (
                                punch.punch_type ===
                                "clock_in"
                            ) {
                                punchLabel =
                                    "Clock In";
                            }

                            if (
                                punch.punch_type ===
                                "clock_out"
                            ) {
                                punchLabel =
                                    "Clock Out";
                            }

                            if (
                                punch.punch_type ===
                                "break_start"
                            ) {
                                punchLabel =
                                    "Break Start";
                            }

                            if (
                                punch.punch_type ===
                                "break_end"
                            ) {
                                punchLabel =
                                    "Break End";
                            }


                            return `
                                <div class="punch-detail-item">

                                    <span class="punch-type">
                                        ${escapeHTML(
                                            punchLabel
                                        )}
                                    </span>

                                    <span>
                                        ${escapeHTML(
                                            formatTime(
                                                punch.punched_at
                                            )
                                        )}
                                    </span>

                                </div>
                            `;
                        })
                        .join("");


                return `

                    <tr
                        class="timecard-row"
                        data-date="${escapeHTML(dateKey)}">

                        <td>
                            <span class="pending">
                                Pending
                            </span>
                        </td>

                        <td>
                            ${escapeHTML(
                                formatDate(
                                    displayDate
                                )
                            )}
                        </td>

                        <td>
                            ${escapeHTML(
                                formatTime(
                                    result.firstClockIn
                                )
                            )}
                        </td>

                        <td>
                            ${escapeHTML(
                                formatTime(
                                    result.lastClockOut
                                )
                            )}
                        </td>

                        <td>
                            —
                        </td>

                       <td>
    ${escapeHTML(total)}
</td>

<td>
    ${escapeHTML(regular)}
</td>

<td>
    ${escapeHTML(overtime)}
</td>

                    </tr>


                    <tr
                        class="punch-detail-row"
                        data-detail-date="${escapeHTML(dateKey)}">

                        <td
                            colspan="8"
                            class="punch-detail-cell">

                            <div class="punch-details">

                                <div class="punch-details-title">
                                    Punch Details
                                </div>

                                ${punchDetails}

                            </div>

                        </td>

                    </tr>
                `;
            })
            .join("");


    timecardBody.innerHTML =
        rows;


    /*
        Open or close the punch details
        when the employee clicks a day.
    */

    const timecardRows =
        timecardBody.querySelectorAll(
            ".timecard-row"
        );


    timecardRows.forEach(row => {

        row.addEventListener(
            "click",
            () => {

                const dateKey =
                    row.dataset.date;

                const detailRow =
                    timecardBody.querySelector(
                        `[data-detail-date="${dateKey}"]`
                    );

                if (detailRow) {
                    detailRow.classList.toggle(
                        "open"
                    );
                }
            }
        );
    });
}

function updatePeriodNavigation() {

    const isCurrentPeriod =
        selectedPayPeriod.key ===
        currentPayPeriod.key;

    periodLabel.textContent =
        isCurrentPeriod
            ? "CURRENT PAY PERIOD"
            : "PAY PERIOD";

    previousPeriodButton.disabled = false;
    nextPeriodButton.disabled =
        !canNavigateToPayPeriod(
            getNextPayPeriod(
                selectedPayPeriod
            )
    );
}

async function loadOvertimeRuleForPeriod(period) {

    const {
        startKey,
        endKey
    } =
        getPayPeriodDateKeys(period);

    const {
        data: overtimeRules,
        error: overtimeRuleError
    } =
        await supabase
            .from("overtime_rules")
            .select(`
                id,
                province_code,
                province_name,
                rule_name,
                weekly_threshold_hours,
                daily_threshold_hours,
                alternate_daily_threshold_hours,
                overtime_multiplier,
                double_time_threshold_hours,
                double_time_multiplier,
                holiday_week_threshold_hours,
                daily_overtime_enabled,
                weekly_overtime_enabled,
                requires_schedule_rule,
                calculation_method,
                holiday_rule,
                holiday_reduction_hours,
                supports_averaging,
                week_start_day,
                effective_from,
                effective_to
            `)
            .eq(
                "province_code",
                employee.province
            )
            .eq(
                "is_active",
                true
            )
            .eq(
                "is_default",
                true
            )
            .eq(
                "is_special_rule",
                false
            )
            .lte(
                "effective_from",
                endKey
            )
            .or(
                `effective_to.is.null,effective_to.gte.${startKey}`
            )
            .order(
                "effective_from",
                {
                    ascending: false
                }
            );

    if (overtimeRuleError) {
        throw overtimeRuleError;
    }

    currentOvertimeRule =
        selectOvertimeRuleForPeriod(
            overtimeRules || [],
            startKey,
            endKey
        );
}

async function loadPayPeriod(period) {

    selectedPayPeriod = period;

    periodValue.textContent =
        formatDate(period.start) +
        " – " +
        formatDate(period.end);

    updatePeriodNavigation();

    previousPeriodButton.disabled = true;
    nextPeriodButton.disabled = true;

    timecardBody.innerHTML = `
        <tr>
            <td colspan="8" class="loading">
                Loading timecard...
            </td>
        </tr>
    `;

    await loadOvertimeRuleForPeriod(period);

    /*
        Extend the punch retrieval range
        back to the beginning of the workweek.

        This allows weekly overtime to be
        calculated correctly when a pay
        period begins in the middle of a week.
    */

    const periodStartParts =
        getDatePartsInEmployeeTimeZone(
            period.start
        );

    const periodStartNoon =
        new Date(
            Date.UTC(
                periodStartParts.year,
                periodStartParts.month - 1,
                periodStartParts.day,
                12, 0, 0, 0
            )
        );

    const weekStartDay =
        Number(
            currentOvertimeRule?.week_start_day ?? 0
        );

    const daysSinceWeekStart =
        (
            periodStartNoon.getUTCDay() -
            weekStartDay +
            7
        ) % 7;

    periodStartNoon.setUTCDate(
        periodStartNoon.getUTCDate() -
        daysSinceWeekStart
    );

    const calculationStart =
        createDateInEmployeeTimeZone(
            periodStartNoon.getUTCFullYear(),
            periodStartNoon.getUTCMonth(),
            periodStartNoon.getUTCDate(),
            0, 0, 0, 0
        );

    const {
        data: punches,
        error: punchesError
    } =
        await supabase
            .from("punches")
            .select(
                "id,punch_type,punched_at,location_name"
            )
            .eq(
                "employee_id",
                employee.id
            )
            .gte(
                "punched_at",
                calculationStart.toISOString()
            )
            .lte(
                "punched_at",
                period.end.toISOString()
            )
            .order(
                "punched_at",
                {
                    ascending: true
                }
            );

    if (punchesError) {
        throw punchesError;
    }

    renderTimecard(
        punches || [],
        period
    );

    updatePeriodNavigation();
}

function getTimecardErrorMessage(
    error,
    fallbackMessage
) {

    return error?.code ===
        "OVERTIME_RULE_BOUNDARY"
            ? error.message
            : fallbackMessage;
}

)

const provinceTimeZones = {

};

employeeTimeZone =

    "America/Toronto";

        if (

                "Account Activated"
        ) {

            throw new Error(

            );
        }
if (!employeeData.province) {

}


        employee =
            employeeData;


        const fullName =
            `${employee.first_name} ${employee.last_name || ""}`
                .trim();


        const details = [];

        details.push(fullName);

        if (employee.position) {

            );

        employeeInfo.textContent =

    } catch (error) {

        console.error(

        const errorMessage =

        timecardBody.innerHTML = `

}

async function navigateToPayPeriod(period) {

    try {
        await loadPayPeriod(period);
    } catch (error) {
        console.error(
            "Pay period navigation error:",
            error
        );

        updatePeriodNavigation();

        const errorMessage =
            getTimecardErrorMessage(
                error,
                "Unable to load this pay period."
            );

        timecardBody.innerHTML = `
            <tr>
                <td colspan="8">
                    <div class="error">
                        ${escapeHTML(errorMessage)}
                    </div>
                </td>
            </tr>
        `;
    }
}
