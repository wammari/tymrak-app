.employee-info {

    border-bottom: 1px solid #e5e7eb;
}

.punch-detail-item:last-child {

}

.timecard-row {
    cursor: pointer;
}

.timecard-row:hover {

<body>

    <div>

</main>


<script type="module">

const SUPABASE_URL =
    "https://tsosredghislnehfyypi.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_u3i0ktj9UjpwUWkEF4sfcg_WZjWo0w6";


import { createClient } from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


const supabase =
    createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


const employeeInfo =
    document.getElementById("employeeInfo");

const periodValue =
    document.getElementById("periodValue");

const timecardBody =
    document.getElementById("timecardBody");

const clockButton =
    document.getElementById("clockButton");

const logoutButton =
    document.getElementById("logoutButton");


let employee = null;


/*
    Current MVP pay period:
    Semi-monthly

    1st - 15th
    16th - last day
*/

function getCurrentPayPeriod() {

    const now =
        new Date();

    const year =
        now.getFullYear();

    const month =
        now.getMonth();

    const day =
        now.getDate();

    let start;
    let end;

    if (day <= 15) {

        start =
            new Date(
                year,
                month,
                1,
                0, 0, 0, 0
            );

        end =
            new Date(
                year,
                month,
                15,
                23, 59, 59, 999
            );

    } else {

        start =
            new Date(
                year,
                month,
                16,
                0, 0, 0, 0
            );

        end =
            new Date(
                year,
                month + 1,
                0,
                23, 59, 59, 999
            );
    }

    return {
        start,
        end
    };
}


function formatDate(date) {

    return date.toLocaleDateString(
        [],
        {
            month: "short",
            day: "numeric",
            year: "numeric"
        }
    );
}


function formatTime(timestamp) {

    if (!timestamp) {
        return "—";
    }

    return new Date(
        timestamp
    ).toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function formatDuration(milliseconds) {

    const totalMinutes =
        Math.floor(
            Math.max(
                0,
                milliseconds
            ) / 60000
        );

    const hours =
        Math.floor(
            totalMinutes / 60
        );

    const minutes =
        totalMinutes % 60;

    return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0")
    );
}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function groupPunchesByDate(punches) {

    const groups = {};

    for (const punch of punches) {

        const date =
            new Date(
                punch.punched_at
            );

        const key =
            date.getFullYear() +
            "-" +
            String(
                date.getMonth() + 1
            ).padStart(2, "0") +
            "-" +
            String(
                date.getDate()
            ).padStart(2, "0");

        if (!groups[key]) {
            groups[key] = [];
        }

        groups[key].push(punch);
    }

    return groups;
}


function calculateDay(punches) {

    let firstClockIn = null;
    let lastClockOut = null;

    let workStartedAt = null;
    let breakStartedAt = null;

    let workedMilliseconds = 0;
    let breakMilliseconds = 0;

    const sortedPunches =
        [...punches].sort(
            (a, b) =>
                new Date(a.punched_at) -
                new Date(b.punched_at)
        );


    for (const punch of sortedPunches) {

        const time =
            new Date(
                punch.punched_at
            ).getTime();


        if (punch.punch_type === "clock_in") {

            if (firstClockIn === null) {
                firstClockIn =
                    punch.punched_at;
            }

            /*
                Start a new work session only
                if one is not already open.
            */

            if (workStartedAt === null) {
                workStartedAt = time;
            }

            breakStartedAt = null;


        } else if (
            punch.punch_type === "break_start"
        ) {

            if (workStartedAt !== null) {

                workedMilliseconds +=
                    Math.max(
                        0,
                        time - workStartedAt
                    );

                workStartedAt = null;
            }

            if (breakStartedAt === null) {
                breakStartedAt = time;
            }


        } else if (
            punch.punch_type === "break_end"
        ) {

            if (breakStartedAt !== null) {

                breakMilliseconds +=
                    Math.max(
                        0,
                        time - breakStartedAt
                    );

                breakStartedAt = null;
            }

            if (workStartedAt === null) {
                workStartedAt = time;
            }


        } else if (
            punch.punch_type === "clock_out"
        ) {

            if (workStartedAt !== null) {

                workedMilliseconds +=
                    Math.max(
                        0,
                        time - workStartedAt
                    );

                workStartedAt = null;
            }

            /*
                If someone clocks out while
                on break, close the break too.
            */

            if (breakStartedAt !== null) {

                breakMilliseconds +=
                    Math.max(
                        0,
                        time - breakStartedAt
                    );

                breakStartedAt = null;
            }

            lastClockOut =
                punch.punched_at;
        }
    }


    /*
        For today's open shift, continue
        counting until the current time.

        Historical incomplete shifts will
        later be flagged as Missing Punch.
    */

    const today =
        new Date();

    const punchDate =
        sortedPunches.length > 0
            ? new Date(
                sortedPunches[0].punched_at
            )
            : null;

    const isToday =
        punchDate &&
        punchDate.getFullYear() ===
            today.getFullYear() &&
        punchDate.getMonth() ===
            today.getMonth() &&
        punchDate.getDate() ===
            today.getDate();


    if (
        isToday &&
        workStartedAt !== null
    ) {

        workedMilliseconds +=
            Math.max(
                0,
                Date.now() -
                workStartedAt
            );
    }


    if (
        isToday &&
        breakStartedAt !== null
    ) {

        breakMilliseconds +=
            Math.max(
                0,
                Date.now() -
                breakStartedAt
            );
    }


    return {
        firstClockIn,
        lastClockOut,
        workedMilliseconds,
        breakMilliseconds
    };
}

function renderTimecard(punches) {

    if (
        !punches ||
        punches.length === 0
    ) {

        timecardBody.innerHTML = `
            <tr>
                <td
                    colspan="8"
                    class="empty">
                    No time recorded for this pay period.
                </td>
            </tr>
        `;

        return;
    }


    const groups =
        groupPunchesByDate(
            punches
        );


    const rows =
        Object.keys(groups)
            .sort()
            .map(dateKey => {

                const dayPunches =
                    groups[dateKey];

                const result =
                    calculateDay(
                        dayPunches
                    );

                const displayDate =
                    new Date(
                        dateKey +
                        "T12:00:00"
                    );

                const total =
                    formatDuration(
                        result.workedMilliseconds
                    );


                /*
                    Build the individual
                    punch details for this day.
                */

                const punchDetails =
                    [...dayPunches]
                        .sort(
                            (a, b) =>
                                new Date(a.punched_at) -
                                new Date(b.punched_at)
                        )
                        .map(punch => {

                            let punchLabel =
                                punch.punch_type;

                            if (
                                punch.punch_type ===
                                "clock_in"
                            ) {
                                punchLabel =
                                    "Clock In";
                            }

                            if (
                                punch.punch_type ===
                                "clock_out"
                            ) {
                                punchLabel =
                                    "Clock Out";
                            }

                            if (
                                punch.punch_type ===
                                "break_start"
                            ) {
                                punchLabel =
                                    "Break Start";
                            }

                            if (
                                punch.punch_type ===
                                "break_end"
                            ) {
                                punchLabel =
                                    "Break End";
                            }


                            return `
                                <div class="punch-detail-item">

                                    <span class="punch-type">
                                        ${escapeHTML(
                                            punchLabel
                                        )}
                                    </span>

                                    <span>
                                        ${escapeHTML(
                                            formatTime(
                                                punch.punched_at
                                            )
                                        )}
                                    </span>

                                </div>
                            `;
                        })
                        .join("");


                return `

                    <tr
                        class="timecard-row"
                        data-date="${escapeHTML(dateKey)}">

                        <td>
                            <span class="pending">
                                Pending
                            </span>
                        </td>

                        <td>
                            ${escapeHTML(
                                formatDate(
                                    displayDate
                                )
                            )}
                        </td>

                        <td>
                            ${escapeHTML(
                                formatTime(
                                    result.firstClockIn
                                )
                            )}
                        </td>

                        <td>
                            ${escapeHTML(
                                formatTime(
                                    result.lastClockOut
                                )
                            )}
                        </td>

                        <td>
                            —
                        </td>

                        <td>
                            ${escapeHTML(total)}
                        </td>

                        <td>
                            ${escapeHTML(total)}
                        </td>

                        <td>
                            00:00
                        </td>

                    </tr>


                    <tr
                        class="punch-detail-row"
                        data-detail-date="${escapeHTML(dateKey)}">

                        <td
                            colspan="8"
                            class="punch-detail-cell">

                            <div class="punch-details">

                                <div class="punch-details-title">
                                    Punch Details
                                </div>

                                ${punchDetails}

                            </div>

                        </td>

                    </tr>
                `;
            })
            .join("");


    timecardBody.innerHTML =
        rows;


    /*
        Open or close the punch details
        when the employee clicks a day.
    */

    const timecardRows =
        timecardBody.querySelectorAll(
            ".timecard-row"
        );


    timecardRows.forEach(row => {

        row.addEventListener(
            "click",
            () => {

                const dateKey =
                    row.dataset.date;

                const detailRow =
                    timecardBody.querySelector(
                        `[data-detail-date="${dateKey}"]`
                    );

                if (detailRow) {
                    detailRow.classList.toggle(
                        "open"
                    );
                }
            }
        );
    });
}


async function loadTimecard() {

    try {

        const {
            data: sessionData,
            error: sessionError
        } =
            await supabase.auth
                .getSession();


        if (
            sessionError ||
            !sessionData.session
        ) {

            window.location.href =
                "/login.html";

            return;
        }


        const user =
            sessionData.session.user;


        const {
            data: employeeData,
            error: employeeError
        } =
            await supabase
                .from("employees")
               .select(
    "id,first_name,last_name,username,position,department,province,invitation_status,is_active"
)
                .eq(
                    "auth_user_id",
                    user.id
                )
                .single();


        if (employeeError) {
            throw employeeError;
        }


        if (
            !employeeData.is_active ||
            employeeData.invitation_status !==
                "Account Activated"
        ) {

            throw new Error(
                "Employee account is not active."
            );
        }
/*
    Load the overtime rule that applies
    to the employee's jurisdiction.
*/

if (!employeeData.province) {
    throw new Error(
        "Employee province/jurisdiction is not assigned."
    );
}


const today =
    new Date()
        .toISOString()
        .split("T")[0];


const {
    data: overtimeRule,
    error: overtimeRuleError
} =
    await supabase
        .from("overtime_rules")
        .select(`
            id,
            province_code,
            province_name,
            rule_name,
            weekly_threshold_hours,
            daily_threshold_hours,
            alternate_daily_threshold_hours,
            overtime_multiplier,
            double_time_threshold_hours,
            double_time_multiplier,
            holiday_week_threshold_hours,
            daily_overtime_enabled,
            weekly_overtime_enabled,
            requires_schedule_rule,
            calculation_method,
            holiday_rule,
            holiday_reduction_hours,
            supports_averaging,
            week_start_day,
            effective_from,
            effective_to
        `)
        .eq(
            "province_code",
            employeeData.province
        )
        .eq(
            "is_active",
            true
        )
        .eq(
            "is_default",
            true
        )
        .eq(
            "is_special_rule",
            false
        )
        .lte(
            "effective_from",
            today
        )
        .or(
            `effective_to.is.null,effective_to.gte.${today}`
        )
        .order(
            "effective_from",
            {
                ascending: false
            }
        )
        .limit(1)
        .maybeSingle();


if (overtimeRuleError) {
    throw overtimeRuleError;
}


if (!overtimeRule) {
    throw new Error(
        `No overtime rule found for ${employeeData.province}.`
    );
}


console.log(
    "TYMRAK Overtime Rule:",
    overtimeRule
);

        employee =
            employeeData;


        const fullName =
            `${employee.first_name} ${employee.last_name || ""}`
                .trim();


        const details = [];

        details.push(fullName);

        if (employee.position) {
            details.push(
                employee.position
            );
        }

        if (employee.department) {
            details.push(
                employee.department
            );
        }


        employeeInfo.textContent =
            details.join(" • ");


        const period =
            getCurrentPayPeriod();


        periodValue.textContent =
            formatDate(period.start) +
            " – " +
            formatDate(period.end);


        const {
            data: punches,
            error: punchesError
        } =
            await supabase
                .from("punches")
                .select(
                    "id,punch_type,punched_at,location_name"
                )
                .eq(
                    "employee_id",
                    employee.id
                )
                .gte(
                    "punched_at",
                    period.start.toISOString()
                )
                .lte(
                    "punched_at",
                    period.end.toISOString()
                )
                .order(
                    "punched_at",
                    {
                        ascending: true
                    }
                );


        if (punchesError) {
            throw punchesError;
        }


        renderTimecard(
            punches || []
        );


    } catch (error) {

        console.error(
            "Timecard error:",
            error
        );

        employeeInfo.textContent =
            "Unable to load timecard.";

        periodValue.textContent =
            "—";

        timecardBody.innerHTML = `
            <tr>
                <td colspan="8">
                    <div class="error">
                        Unable to load your timecard.
                    </div>
                </td>
            </tr>
        `;
    }
}


clockButton.addEventListener(
    "click",
    () => {

        window.location.href =
            "/employee.html";
    }
);


logoutButton.addEventListener(
    "click",
    async () => {

        await supabase.auth
            .signOut();

        window.location.href =
            "/login.html";
    }
);


loadTimecard();

</script>
